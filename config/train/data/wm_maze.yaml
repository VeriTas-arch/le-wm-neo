dataset:
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 1
  name: wm_maze.h5
  format: hdf5
  keys_to_load:
    - pixels
    - action
    - cue_color
    - valid_mask
    - transition_mask
    - decision_mask
    - memory_mask
  keys_to_cache:
    - action
    - cue_color
    - valid_mask
    - transition_mask
    - decision_mask
    - memory_mask
